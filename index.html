<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Archive LAB | 성인애착유형 테스트</title>

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: #faf6ee;
            color: #49372e;
        }


        /* =========================
           상단 헤더
        ========================= */

        header {
            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background: #fffaf2;

            border-bottom: 1px solid #eadfd1;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
        }

        .menu {
            font-size: 27px;
            cursor: pointer;
        }


        /* =========================
           메인 화면
        ========================= */

        .hero {
            position: relative;

            width: 100%;
            min-height: 680px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background-image: url("images/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           가운데 글자
        ========================= */

        .center-content {
            position: relative;
            z-index: 20;

            text-align: center;

            padding: 30px;
        }

        .small-title {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .main-title {
            font-size: clamp(42px, 5vw, 64px);
            line-height: 1.2;

            font-weight: 800;

            margin-bottom: 22px;
        }

        .main-title span {
            color: #ad6047;
        }

        .description {
            font-size: 17px;
            line-height: 1.8;

            color: #74675e;
        }


        /* =========================
           테스트 시작 버튼
        ========================= */

        .start-button {
            margin-top: 30px;

            padding: 18px 48px;

            border: none;
            border-radius: 50px;

            background: #ad6047;

            color: white;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(100, 60, 40, 0.18);

            transition: 0.2s;
        }

        .start-button:hover {
            transform: translateY(-3px);

            background: #995039;

            box-shadow:
                0 12px 25px rgba(100, 60, 40, 0.25);
        }


        /* =========================
           캐릭터 공통
        ========================= */

        .character {
            position: absolute;
            z-index: 5;
        }

        .character img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* =========================
           PC - 안정형
        ========================= */

        .secure {
            width: clamp(230px, 25vw, 390px);

            left: 1%;
            top: 5%;
        }


        /* =========================
           PC - 불안형
        ========================= */

        .anxious {
            width: clamp(230px, 25vw, 390px);

            right: 1%;
            top: 4%;
        }


        /* =========================
           PC - 회피형
        ========================= */

        .avoidant {
            width: clamp(230px, 25vw, 390px);

            right: 5%;
            bottom: 0;
        }


        /* =========================
           푸터
        ========================= */

        footer {
            padding: 27px 5%;

            background: #fffaf2;

            border-top: 1px solid #eadfd1;
        }

        .footer-title {
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .footer-text {
            font-size: 14px;

            color: #6f635c;
        }

        .copyright {
            margin-top: 12px;

            font-size: 12px;

            color: #a19790;
        }


        /* =========================================
           📱 모바일
           700px 이하에서만 적용
        ========================================= */

        @media (max-width: 700px) {

            /* 헤더 */

            header {
                height: 58px;

                padding: 0 18px;
            }

            .logo {
                font-size: 17px;
            }

            .menu {
                font-size: 23px;
            }


            /* 메인 */

            .hero {
                min-height: calc(100svh - 58px);

                display: flex;
                align-items: flex-start;
                justify-content: center;

                padding:
                    48px
                    15px
                    185px
                    15px;

                background-size: cover;
                background-position: center;
            }


            /* 가운데 내용 */

            .center-content {
                width: 100%;

                margin: 0;
                padding: 0 10px;
            }

            .small-title {
                font-size: 18px;

                margin-bottom: 4px;
            }

            .main-title {
                font-size: 34px;
                line-height: 1.15;

                margin-bottom: 13px;
            }

            .description {
                font-size: 14px;
                line-height: 1.6;
            }


            /* 버튼 */

            .start-button {
                margin-top: 20px;

                padding: 14px 30px;

                font-size: 15px;
            }


            /* =========================
               모바일 캐릭터
               세 개를 아래에 모음
            ========================= */

            .secure {
                width: 145px;

                left: -18px;
                top: auto;
                bottom: 12px;
            }

            .anxious {
                width: 145px;

                left: 50%;
                right: auto;

                top: auto;
                bottom: 2px;

                transform: translateX(-50%);
            }

            .avoidant {
                width: 145px;

                right: -18px;

                top: auto;
                bottom: 12px;
            }


            /* 푸터 */

            footer {
                padding: 15px 18px;
            }

            .footer-title {
                font-size: 13px;
            }

            .footer-text {
                font-size: 12px;
            }

            .copyright {
                margin-top: 7px;

                font-size: 10px;
            }
        }


        /* =========================================
           📱 아주 작은 휴대폰
        ========================================= */

        @media (max-width: 380px) {

            .hero {
                padding-top: 38px;
                padding-bottom: 165px;
            }

            .main-title {
                font-size: 30px;
            }

            .secure,
            .anxious,
            .avoidant {
                width: 130px;
            }

            .secure {
                left: -22px;
            }

            .avoidant {
                right: -22px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         상단
    ========================== -->

    <header>

        <div class="logo">
            📖 Archive LAB
        </div>

        <div class="menu">
            ☰
        </div>

    </header>



    <!-- =========================
         메인
    ========================== -->

    <main class="hero">


        <!-- 안정형 -->

        <div class="character secure">

            <img
                src="images/secure.png"
                alt="안정형"
            >

        </div>



        <!-- 불안형 -->

        <div class="character anxious">

            <img
                src="images/anxious.png"
                alt="불안형"
            >

        </div>



        <!-- 회피형 -->

        <div class="character avoidant">

            <img
                src="images/avoidant.png"
                alt="회피형"
            >

        </div>



        <!-- 가운데 제목 -->

        <div class="center-content">

            <div class="small-title">
                두근두근,
            </div>


            <h1 class="main-title">

                성인애착유형
                <span>테스트</span>

            </h1>


            <div class="description">

                몇 가지 질문에 답하며<br>

                나의 관계 속 모습을 알아보세요.

            </div>


            <button
                class="start-button"
                onclick="startTest()"
            >

                테스트 시작하기 →

            </button>

        </div>


    </main>



    <!-- =========================
         하단
    ========================== -->

    <footer>

        <div class="footer-title">
            청년 프로젝트 & 아카이브 연구소
        </div>

        <div class="footer-text">
            기록은 남기고, 이야기는 이어지게.
        </div>

        <div class="copyright">
            © 2026 Archive LAB. All rights reserved.
        </div>

    </footer>



    <!-- =========================
         버튼 기능
    ========================== -->

    <script>

        function startTest() {

            alert("테스트 페이지를 준비 중입니다!");

        }

    </script>


</body>

</html>
