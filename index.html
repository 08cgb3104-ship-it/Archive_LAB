<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Archive LAB | 성인애착유형 테스트</title>

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
        }

        body {
            font-family:
                "Malgun Gothic",
                "Apple SD Gothic Neo",
                sans-serif;

            background: #faf6ee;
            color: #49372e;
        }


        /* =========================
           상단 메뉴
        ========================= */

        header {
            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background: #fffaf2;

            border-bottom: 1px solid #eadfd1;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
        }

        .menu {
            font-size: 28px;
            cursor: pointer;
        }


        /* =========================
           전체 메인
        ========================= */

        .hero {
            width: 100%;

            background-image:
                url("images/background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding:
                60px
                30px
                45px;
        }


        /* =========================
           제목 영역
        ========================= */

        .intro {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            text-align: center;
        }

        .small-title {
            font-size: 25px;

            margin-bottom: 7px;
        }

        .main-title {
            font-size: clamp(40px, 5vw, 62px);

            line-height: 1.15;

            font-weight: 800;

            margin-bottom: 20px;
        }

        .main-title span {
            color: #ad6047;
        }


        /* =========================
           설명
        ========================= */

        .description {
            font-size: 17px;
            line-height: 1.8;

            color: #74675e;
        }


        /* =========================
           시작 버튼
        ========================= */

        .start-button {
            margin-top: 27px;

            padding: 17px 45px;

            border: none;
            border-radius: 50px;

            background: #ad6047;

            color: white;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(100, 60, 40, 0.18);

            transition: 0.2s;
        }

        .start-button:hover {
            transform: translateY(-3px);

            background: #995039;
        }


        /* =========================
           캐릭터 영역
        ========================= */

        .characters {

            width: 100%;
            max-width: 1100px;

            margin:
                45px
                auto
                0;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            gap: 18px;
        }


        /* 각각의 캐릭터 */

        .character {
            flex: 1;

            max-width: 350px;

            display: flex;
            justify-content: center;
        }

        .character img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }


        /* 가운데 불안형을 살짝 강조 */

        .anxious {
            transform: translateY(-5px);
        }


        /* =========================
           하단
        ========================= */

        footer {
            width: 100%;

            padding:
                25px
                5%;

            background: #fffaf2;

            border-top:
                1px solid #eadfd1;
        }

        .footer-title {
            font-size: 16px;
            font-weight: 700;

            margin-bottom: 6px;
        }

        .footer-text {
            font-size: 14px;

            color: #6f635c;
        }

        .copyright {
            margin-top: 12px;

            font-size: 12px;

            color: #a19790;
        }



        /* =========================================
           모바일
           배치는 PC와 동일
           크기만 줄어듦
        ========================================= */

        @media (max-width: 700px) {

            header {
                height: 58px;

                padding:
                    0
                    18px;
            }

            .logo {
                font-size: 17px;
            }

            .menu {
                font-size: 23px;
            }


            /* 메인 여백 축소 */

            .hero {
                padding:
                    38px
                    12px
                    25px;
            }


            /* 제목 */

            .small-title {
                font-size: 18px;

                margin-bottom: 5px;
            }

            .main-title {
                font-size: 34px;

                margin-bottom: 14px;
            }


            /* 설명 */

            .description {
                font-size: 14px;

                line-height: 1.6;
            }


            /* 버튼 */

            .start-button {
                margin-top: 19px;

                padding:
                    14px
                    31px;

                font-size: 15px;
            }


            /* =========================
               모바일 캐릭터

               PC와 똑같이
               3개를 한 줄에 배치
            ========================= */

            .characters {

                margin-top: 35px;

                gap: 2px;

                align-items: flex-end;
            }


            .character {

                width: 33.333%;

                min-width: 0;
            }


            .character img {

                width: 100%;

                height: auto;
            }


            .anxious {

                transform:
                    translateY(-4px);
            }


            /* 하단 */

            footer {

                padding:
                    16px
                    18px;
            }

            .footer-title {

                font-size: 13px;
            }

            .footer-text {

                font-size: 12px;
            }

            .copyright {

                margin-top: 7px;

                font-size: 10px;
            }

        }



        /* =========================
           아주 작은 휴대폰
        ========================= */

        @media (max-width: 380px) {

            .hero {

                padding-top: 30px;
            }

            .main-title {

                font-size: 30px;
            }

            .characters {

                margin-top: 28px;
            }

        }


    </style>

</head>


<body>


    <!-- =========================
         상단
    ========================== -->

    <header>

        <div class="logo">

            📖 Archive LAB

        </div>


        <div class="menu">

            ☰

        </div>

    </header>



    <!-- =========================
         메인
    ========================== -->

    <main class="hero">


        <!-- 제목 -->

        <section class="intro">


            <div class="small-title">

                두근두근,

            </div>


            <h1 class="main-title">

                성인애착유형
                <span>테스트</span>

            </h1>


            <div class="description">

                몇 가지 질문에 답하며<br>

                나의 관계 속 모습을 알아보세요.

            </div>



            <!-- 실제 버튼 -->

            <button
                class="start-button"
                onclick="startTest()">

                테스트 시작하기 →

            </button>


        </section>



        <!-- =========================
             캐릭터 3개
        ========================== -->

        <section class="characters">


            <!-- 안정형 -->

            <div class="character secure">

                <img
                    src="images/secure.png"
                    alt="안정형">

            </div>



            <!-- 불안형 -->

            <div class="character anxious">

                <img
                    src="images/anxious.png"
                    alt="불안형">

            </div>



            <!-- 회피형 -->

            <div class="character avoidant">

                <img
                    src="images/avoidant.png"
                    alt="회피형">

            </div>


        </section>


    </main>



    <!-- =========================
         하단
    ========================== -->

    <footer>


        <div class="footer-title">

            청년 프로젝트 & 아카이브 연구소

        </div>


        <div class="footer-text">

            기록은 남기고, 이야기는 이어지게.

        </div>


        <div class="copyright">

            © 2026 Archive LAB.
            All rights reserved.

        </div>


    </footer>



    <!-- =========================
         버튼 기능
    ========================== -->

    <script>

        function startTest() {

            alert("테스트 페이지를 준비 중입니다!");

        }

    </script>


</body>

</html>
