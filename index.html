<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Archive LAB | 성인애착유형 테스트</title>

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                "Malgun Gothic",
                "Apple SD Gothic Neo",
                sans-serif;

            background: #fffaf2;
            color: #49372e;
        }


        /* =========================
           전체 페이지
        ========================= */

        .page {
            min-height: 100svh;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           헤더
        ========================= */

        header {
            flex-shrink: 0;

            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background: #fffaf2;

            border-bottom: 1px solid #eadfd1;

            position: relative;
            z-index: 100;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
        }

        .menu {
            font-size: 28px;
            cursor: pointer;
        }


        /* =========================
           메인 영역
        ========================= */

        .hero {
            flex: 1;

            width: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background-image:
                url("images/background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding:
                55px
                30px
                35px;
        }


        /* =========================
           제목 영역
        ========================= */

        .intro {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            text-align: center;
        }


        .small-title {
            font-size: 25px;

            margin-bottom: 7px;
        }


        .main-title {
            font-size:
                clamp(40px, 5vw, 62px);

            line-height: 1.15;

            font-weight: 800;

            margin-bottom: 20px;
        }


        .main-title span {
            color: #ad6047;
        }


        /* =========================
           설명
        ========================= */

        .description {
            font-size: 17px;

            line-height: 1.8;

            color: #74675e;
        }


        /* =========================
           시작 버튼
        ========================= */

        .start-button {
            margin-top: 27px;

            padding:
                17px
                45px;

            border: none;

            border-radius: 50px;

            background: #ad6047;

            color: white;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(100, 60, 40, 0.18);

            transition: 0.2s;
        }


        .start-button:hover {
            transform:
                translateY(-3px);

            background: #995039;
        }


        /* =========================
           캐릭터 영역
        ========================= */

        .characters {
            width: 100%;

            max-width: 1100px;

            margin:
                45px
                auto
                0;

            display: flex;

            justify-content: center;
            align-items: flex-end;

            gap: 18px;
        }


        .character {
            flex: 1;

            max-width: 350px;

            display: flex;

            justify-content: center;
            align-items: flex-end;
        }


        .character img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }


        /* 불안형 살짝 위 */

        .anxious {
            transform:
                translateY(-5px);
        }


        /* =========================
           푸터
        ========================= */

        footer {
            flex-shrink: 0;

            width: 100%;

            padding:
                24px
                5%;

            background: #fffaf2;

            border-top:
                1px solid #eadfd1;
        }


        .footer-title {
            font-size: 16px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .footer-text {
            font-size: 14px;

            color: #6f635c;
        }


        .copyright {
            margin-top: 11px;

            font-size: 12px;

            color: #a19790;
        }



        /* ==========================================
           📱 모바일
        ========================================== */

        @media (max-width: 700px) {


            /* =========================
               헤더
            ========================= */

            header {
                height: 58px;

                padding:
                    0
                    18px;
            }


            .logo {
                font-size: 17px;
            }


            .menu {
                font-size: 23px;
            }



            /* =========================
               메인

               핵심:
               남은 화면을 전부 사용
            ========================= */

            .hero {
                flex: 1;

                min-height: 0;

                justify-content: center;

                padding:
                    55px
                    12px
                    35px;

                background-size: cover;

                background-position:
                    center center;
            }



            /* =========================
               제목
            ========================= */

            .small-title {
                font-size: 18px;

                margin-bottom: 5px;
            }


            .main-title {
                font-size: 34px;

                line-height: 1.15;

                margin-bottom: 17px;
            }



            /* =========================
               설명
            ========================= */

            .description {
                font-size: 14px;

                line-height: 1.7;
            }



            /* =========================
               버튼
            ========================= */

            .start-button {
                margin-top: 22px;

                padding:
                    14px
                    31px;

                font-size: 15px;
            }



            /* =========================
               캐릭터

               버튼과 그림 사이 간격
            ========================= */

            .characters {
                margin-top: 55px;

                gap: 3px;

                align-items: flex-end;
            }


            .character {
                width: 33.333%;

                min-width: 0;

                flex: 1;
            }


            .character img {
                width: 100%;

                height: auto;
            }


            .anxious {
                transform:
                    translateY(-4px);
            }



            /* =========================
               푸터
            ========================= */

            footer {
                padding:
                    22px
                    18px
                    20px;
            }


            .footer-title {
                font-size: 13px;
            }


            .footer-text {
                font-size: 12px;
            }


            .copyright {
                margin-top: 8px;

                font-size: 10px;
            }

        }



        /* ==========================================
           📱 작은 휴대폰
        ========================================== */

        @media (max-width: 380px) {


            .hero {
                padding:
                    40px
                    10px
                    25px;
            }


            .main-title {
                font-size: 30px;
            }


            .characters {
                margin-top: 40px;
            }

        }



        /* ==========================================
           세로가 짧은 휴대폰
        ========================================== */

        @media
        (max-width: 700px)
        and (max-height: 700px) {


            .hero {
                padding-top: 30px;

                padding-bottom: 20px;
            }


            .characters {
                margin-top: 30px;
            }


            .start-button {
                margin-top: 15px;
            }

        }


    </style>

</head>


<body>


<div class="page">


    <!-- =========================
         HEADER
    ========================== -->

    <header>


        <div class="logo">

            📖 Archive LAB

        </div>


        <div class="menu">

            ☰

        </div>


    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="hero">


        <!-- 제목 -->

        <section class="intro">


            <div class="small-title">

                나의 성향은 뭘까?

            </div>



            <h1 class="main-title">

                성인애착유형
                <span>테스트</span>

            </h1>



            <div class="description">

                몇 가지 질문에 답하며<br>

                나의 관계 속 모습을 알아보세요.

            </div>



            <button
                class="start-button"
                onclick="startTest()">

                테스트 시작하기 →

            </button>


        </section>



        <!-- =========================
             캐릭터
        ========================== -->

        <section class="characters">


            <!-- 안정형 -->

            <div class="character secure">

                <img
                    src="images/secure.png"
                    alt="안정형">

            </div>



            <!-- 불안형 -->

            <div class="character anxious">

                <img
                    src="images/anxious.png"
                    alt="불안형">

            </div>



            <!-- 회피형 -->

            <div class="character avoidant">

                <img
                    src="images/avoidant.png"
                    alt="회피형">

            </div>


        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>


        <div class="footer-title">

            청년 프로젝트 & 아카이브 연구소

        </div>


        <div class="footer-text">

            기록은 남기고, 이야기는 이어지게.

        </div>


        <div class="copyright">

            © 2026 Archive LAB. All rights reserved.

        </div>


    </footer>


</div>



<!-- =========================
     버튼 기능
========================== -->

<script>


    function startTest() {

        alert(
            "테스트 페이지를 준비 중입니다!"
        );

    }


</script>


</body>

</html>
